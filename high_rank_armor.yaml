# Monster Hunter Wilds -- High Rank Armor Pieces
# Source: https://game8.co/games/Monster-Hunter-Wilds/archives/500343
# Each entry is one armor piece (Helm/Mail/Vambraces/Coil/Greaves, or a
# standalone accessory-type piece). 'slots' gives the transcended slot
# values when the piece supports Armor Transcending (rarity 5-7 in most
# cases), otherwise the base slot values (see 'slots_source').
# 'piece_type' is the equipment slot (head/chest/arms/waist/legs) the
# piece occupies. For 5-piece sets this is inferred from position within
# the set, since the source data is consistently ordered
# head, chest, arms, waist, legs per set/rarity -- piece *names* alone are
# not a reliable indicator (e.g. 'Coat' is a chest piece in one set but a
# waist piece in another). Incomplete sets are classified by hand instead.
